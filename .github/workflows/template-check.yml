name: Template Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Build, Copy, Run Checks
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ci/logs
          : > .ci/template_results.txt

          # Get all compose services.
          SERVICES=$(PROJECT_PATH="$PWD/apps" PROJECT_ID=ci docker compose config --services)

          FAIL=0

          for SVC in $SERVICES; do
            BUILD_PATH=$(awk -v svc="$SVC" '
              $1==svc":" {in_service=1; next}
              in_service && $1=="build:" {print $2; exit}
              in_service && $1 ~ /^[A-Za-z0-9_-]+:$/ {in_service=0}
            ' docker-compose.yml)

            BUILD_PATH=${BUILD_PATH#./}
            SRC_PATH="$BUILD_PATH/src"
            if [[ ! -d "$SRC_PATH" ]]; then
              SRC_PATH="$BUILD_PATH"
            fi

            echo "=== $SVC ===" >> .ci/template_results.txt
            echo "build_path=$BUILD_PATH" >> .ci/template_results.txt
            echo "src_path=$SRC_PATH" >> .ci/template_results.txt

            # 1) Build
            if PROJECT_PATH="$PWD/$SRC_PATH" PROJECT_ID=ci docker compose build "$SVC" > ".ci/logs/${SVC}_build.log" 2>&1; then
              echo "build=PASS" >> .ci/template_results.txt
            else
              echo "build=FAIL" >> .ci/template_results.txt
              tail -n 20 ".ci/logs/${SVC}_build.log" | sed 's/^/build_error: /' >> .ci/template_results.txt
              echo >> .ci/template_results.txt
              FAIL=1
              continue
            fi

            # Skip Windows-only batch service on Linux runners.
            if [[ "$SVC" == "batch" ]]; then
              echo "copy=SKIP" >> .ci/template_results.txt
              echo "run=SKIP" >> .ci/template_results.txt
              echo "message=SKIP" >> .ci/template_results.txt
              echo >> .ci/template_results.txt
              continue
            fi

            # 2) Copy check: confirm one source file exists inside /app.
            MARKER=$(cd "$SRC_PATH" && find . -type f | sed 's|^./||' | head -n 1 || true)
            if [[ -z "$MARKER" ]]; then
              echo "copy=FAIL" >> .ci/template_results.txt
              echo "copy_error: no source files found" >> .ci/template_results.txt
              FAIL=1
            elif PROJECT_PATH="$PWD/$SRC_PATH" PROJECT_ID=ci docker compose run -T --rm --no-deps "$SVC" sh -lc "test -e /app/$MARKER" > ".ci/logs/${SVC}_copy.log" 2>&1; then
              echo "copy=PASS" >> .ci/template_results.txt
            else
              echo "copy=FAIL" >> .ci/template_results.txt
              tail -n 20 ".ci/logs/${SVC}_copy.log" | sed 's/^/copy_error: /' >> .ci/template_results.txt
              FAIL=1
            fi

            # 3) Run check: run service with timeout so long-running servers don't hang CI.
            if timeout 35s env PROJECT_PATH="$PWD/$SRC_PATH" PROJECT_ID=ci docker compose run -T --rm --no-deps "$SVC" > ".ci/logs/${SVC}_run.log" 2>&1; then
              echo "run=PASS" >> .ci/template_results.txt
            else
              RC=$?
              if [[ $RC -eq 124 ]]; then
                echo "run=PASS" >> .ci/template_results.txt
              else
                echo "run=FAIL" >> .ci/template_results.txt
                tail -n 20 ".ci/logs/${SVC}_run.log" | sed 's/^/run_error: /' >> .ci/template_results.txt
                FAIL=1
              fi
            fi

            # 4) Message check
            if grep -R -q "Put Your Application Here" "$SRC_PATH"; then
              echo "message=PASS" >> .ci/template_results.txt
            else
              echo "message=FAIL" >> .ci/template_results.txt
              echo "message_error: phrase missing in source files" >> .ci/template_results.txt
              FAIL=1
            fi

            echo >> .ci/template_results.txt
          done

          cat .ci/template_results.txt
          exit $FAIL

      - name: Upload Check Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-check-results
          path: |
            .ci/template_results.txt
            .ci/logs/
